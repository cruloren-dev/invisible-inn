name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Check story content
        run: python -m invisible_inn.content.validate
      - name: Story map for this change (see the run's Summary page)
        run: python -m invisible_inn.content.storymap >> "$GITHUB_STEP_SUMMARY"
      - name: Run tests
        run: python -m pytest -v
        env:
          REQUIRE_DISCORD: "1"   # don't let Discord tests silently skip
