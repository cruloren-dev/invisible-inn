foyer:
  title: The Foyer
  text: |
    The moment you cross the threshold, the inn appears around you all at
    once: a crackling hearth, a front desk polished to a mirror shine, and
    a staircase that seems to go up further than the building could.

    A brass key hangs on a hook behind the desk. Beside the stairs is a
    green door with a keyhole.
  choices:
    - id: ring_bell
      label: Ring the bell on the desk
      goto: innkeeper
      completes_quests: [find_the_innkeeper]
    - id: take_key
      label: Take the brass key
      goto: foyer
      gives: [brass_key]
      result_text: You lift the key from its hook. Nobody stops you.
      requires:
        not_items: [brass_key]
    - id: green_door
      label: Open the green door
      goto: green_room
      takes: [brass_key]
      result_text: The key turns with a satisfied click and stays in the lock.
      requires:
        items: [brass_key]
      show_locked: true          # shown greyed-out until you have the key
    - id: leave_inn
      label: Go back outside
      goto: ending_walk_away

innkeeper:
  title: The Innkeeper
  text: |
    The bell's chime hangs in the air. A pair of spectacles rises from
    behind the desk, followed by nothing at all.

    "Welcome, welcome," says a warm voice from just above the spectacles.
    "Staying the night? We don't get many guests who can find us."
  choices:
    - id: recite_sign
      label: '"Guests welcome, visible or otherwise."'
      description: Repeat the words from the sign
      goto: innkeeper
      requires:
        flags: [read_sign]
        not_items: [lantern]
      gives: [lantern]
      result_text: |
        The spectacles tilt approvingly. "Ah, someone who reads the sign!
        Take this. You'll want it where you're going."
    - id: ask_cipher
      label: Show the innkeeper the cipher on your cuff
      goto: innkeeper
      requires:
        roles: [scholar]
        items: [cuff_cipher]               # needs the cipher you copied
        quests_active: [decode_the_sign]   # only while the quest is in progress
      takes: [cuff_cipher]                 # the innkeeper keeps it
      completes_quests: [decode_the_sign]
      result_text: |
        "Oh, that old thing! I wrote it myself, to keep out anyone who
        doesn't read the small print." The spectacles look delighted.
    - id: ask_drinks
      label: Ask what's on tap
      goto: bar
    - id: back_to_foyer
      label: Return to the foyer
      goto: foyer

# More than five choices, so this scene shows a dropdown menu instead of buttons.
bar:
  title: The Bar
  text: |
    A chalkboard behind the bar lists the drinks in handwriting that is
    still being written. The innkeeper's spectacles wait patiently.
  choices:
    - id: cider
      label: Cloudy cider
      description: Sweet, and faintly glowing
      goto: bar
      result_text: The cider tastes of autumn. Your hand holding the glass flickers.
    - id: ale
      label: Fog ale
      description: The house special
      goto: bar
      result_text: The ale is cold and thick as the fog outside.
    - id: tea
      label: Nettle tea
      description: For guests who plan to stay awake
      goto: bar
      result_text: The tea is scalding. You feel very awake, and very visible.
    - id: water
      label: Just water, please
      goto: bar
      result_text: The glass arrives already empty, and yet you feel refreshed.
    - id: mystery
      label: Whatever the fiddler is having
      description: The innkeeper raises an eyebrow you can't see
      goto: bar
      result_text: Something fizzes, hums a few bars of the fiddle tune, and is gone.
    - id: lantern_oil
      label: A thimble of lantern oil
      description: Only offered to guests carrying a lantern
      goto: bar
      requires:
        items: [lantern]         # hidden until you have the lantern (menus can't grey out)
      result_text: The innkeeper tops up your lantern instead. "Can't have you drinking that."
    - id: leave_bar
      label: Back to the desk
      goto: innkeeper

green_room:
  title: Behind the Green Door
  ending: true
  text: |
    The door swings open onto a long hallway lit by lanterns that hang in
    the air with nothing holding them. Somewhere at the far end, someone
    is waiting for you.

    **To be continued…**

    *(End of the sample adventure. Writers: this is where the real story
    begins.)*
