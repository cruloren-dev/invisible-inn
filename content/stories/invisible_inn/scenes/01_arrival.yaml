# Milestone 1: Arrival at the Invisible Inn. DRAFT: edit freely.

arrival_storm:
  title: A Very Rude Storm
  text: |
    The storm has opinions, and all of them are about you.

    Rain comes sideways. Wind steals Fennick's hat for the third time. Sable
    has stopped complaining, which is worse than when she was complaining.
    The three of you haven't travelled together in years, and the weather
    seems determined to remind you why.

    Then, between one lightning flash and the next, there is a building
    where there wasn't one: a crooked, cheerful inn with every window lit.
    The sign above the door is blank. The door itself is ajar, as if
    somebody just stepped out to check on you.

    "That," says Fennick, dripping, "was *not* there a second ago."

    "Good," says Sable. "Things that are there are usually locked."
  role_text:
    rogue: |
      The storm has opinions, and all of them are about you.

      Rain comes sideways. Wind steals Fennick's hat for the third time.
      Tamsin has started reading the raindrops, which is either a very good
      sign or a very bad one. You've stopped complaining, which is worse than
      when you were complaining. The three of you haven't travelled together
      in years, and the weather seems determined to remind you why.

      Then, between one lightning flash and the next, there is a building
      where there wasn't one: a crooked, cheerful inn with every window lit.
      The sign above the door is blank. The door itself is ajar, as if
      somebody just stepped out to check on you.

      "That," says Fennick, dripping, "was *not* there a second ago."

      "Good," you say. "Things that are there are usually locked."

      You say it lightly. You've been chasing a rumour for six weeks: an inn
      that appears to people who need it, and a vault that nobody believes in.
      You had not expected the rumour to be *right*.
  choices:
    - id: knock
      label: Knock on the door
      goto: foyer_arrival
      result_text: The door swings open before your knuckles land. It seems pleased to be asked.
    - id: study_doorframe
      label: Study the shimmering doorframe
      goto: arrival_storm
      requires:
        roles: [scholar]
        not_flags: [noticed_wards]
      sets_flags: [noticed_wards]
      result_text: |
        The frame is carved with old sanctuary wards, the kind you've only
        seen in footnotes. They translate roughly as *"Shelter for those who
        need it."* Underneath, in much newer letters: *"Wipe your feet."*
    - id: sable_lock
      label: Let Sable pick the lock
      goto: foyer_arrival
      requires:
        not_roles: [rogue]   # the Rogue *is* Sable: she has her own version below
      result_text: |
        Sable kneels, produces a lockpick from somewhere, and the door opens by
        itself before she touches it. She looks deeply offended.
    - id: pick_lock
      label: Pick the lock
      goto: foyer_arrival
      requires:
        roles: [rogue]
      result_text: |
        You kneel, produce a lockpick from somewhere, and the door opens by
        itself before you touch it. You are deeply, professionally offended.
    - id: keep_walking
      label: Suggest you all keep walking
      goto: arrival_storm
      requires:
        not_flags: [tried_leaving]
      sets_flags: [tried_leaving]
      result_text: |
        Lightning strikes the exact spot you were about to step on. Then,
        pointedly, the spot next to it. The inn's windows glow a little warmer.
        Message received.

foyer_arrival:
  title: The Foyer
  text: |
    Warmth hits you like a hug from someone who's missed you. A fire crackles
    in a hearth big enough to park a cart in. Three pairs of slippers wait by
    the door, in exactly your sizes, which is lovely and also deeply alarming.

    Fennick holds his hands to the fire and steams gently. Sable is already
    checking the windows, and it's hard to tell if she's looking for exits or
    for valuables. Somewhere deeper in the inn, something smells like toast.

    There's a front desk, but nobody behind it. A small brass bell sits on
    top with a note taped to it: *"Don't bother."*
  role_text:
    rogue: |
      Warmth hits you like a hug from someone who's missed you. A fire crackles
      in a hearth big enough to park a cart in. Three pairs of slippers wait by
      the door, in exactly your sizes, which is lovely and also deeply alarming.
      Nobody measured you. You'd have noticed.

      Fennick holds his hands to the fire and steams gently. Tamsin is reading
      the ledger on the front desk from a careful distance, as if it might
      bite. You're already checking the windows, the latches and the
      second-best hiding places, out of habit and not, you tell yourself, for
      any particular reason. Somewhere deeper in the inn, something smells like
      toast.

      There's a front desk, but nobody behind it. A small brass bell sits on
      top with a note taped to it: *"Don't bother."*
  choices:
    - id: check_desk
      label: Check the desk drawers
      goto: foyer_arrival
      requires:
        roles: [rogue]
        not_flags: [checked_desk]
      sets_flags: [checked_desk]
      result_text: |
        Empty, apart from a single mint and a sticky note: "Yes, I know you're
        looking. Help yourself to the mint." You take the mint. It feels like
        losing a round.
    - id: warm_up
      label: Warm up by the fire
      goto: foyer_arrival
      requires:
        not_flags: [warmed_up]
      sets_flags: [warmed_up]
      result_text: |
        The three of you stand at the fire in silence. "So," says Fennick
        eventually. "How've you all been? Since... everything?" Nobody answers.
        The fire pops, helpfully.
    - id: follow_toast
      label: Follow the smell of toast
      goto: kitchen
    - id: go_deeper
      label: Head deeper into the inn
      goto: main_hall
    - id: back_outside
      label: Step back outside into the storm
      goto: arrival_storm
      result_text: |
        You poke your head back out. The storm is still there, and still rude.
        The slippers by the door watch you go with visible disappointment.

kitchen:
  title: The Kitchen
  text: |
    The kitchen is spotless and busy, and nobody is in it. A loaf slices
    itself. Toast pops up, butters itself, and slides onto three plates.

    On the stove sits a copper kettle that is very clearly sulking. It
    rattles its lid when Fennick walks in, and Fennick goes a shade paler.

    "I'm sure it's a normal kettle," he says, to nobody. "Just a regular,
    normal kettle."
  choices:
    - id: cheer_kettle
      label: Say something nice to the kettle
      goto: kitchen
      requires:
        not_flags: [kettle_cheered]
      sets_flags: [kettle_cheered]
      starts_quests: [cure_the_kettle]   # Fennick's (the Mage's) secret quest; a Scholar never sees it
      result_text: |
        You tell the kettle it has a lovely shine. It whistles a happy little
        tune, one that Fennick apparently recognises, because he drops his
        toast. "That's— no. No. Coincidence."
    - id: eat_toast
      label: Eat the toast
      goto: kitchen
      requires:
        not_flags: [ate_toast]
      sets_flags: [ate_toast]
      result_text: It's perfect. Of course it's perfect. Sable pockets a second slice "for later".
      role_result_text:
        rogue: It's perfect. Of course it's perfect. You pocket a second slice "for later".
    - id: pocket_spoons
      label: Pocket a few of the good spoons
      goto: kitchen
      requires:
        roles: [rogue]
        not_items: [pocketed_silver]
      gives: [pocketed_silver]
      result_text: |
        Three spoons, a fork and (you'll swear later that this was an accident)
        the sugar tongs. It's just habit. You'll put them back. Probably.
    - id: back_to_foyer
      label: Back to the foyer
      goto: foyer_arrival
