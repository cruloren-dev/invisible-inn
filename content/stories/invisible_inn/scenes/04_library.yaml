# Milestone 3 (the library) and Milestone 5 (the Scholar's secret). DRAFT: edit freely.
# The Rogue's secret room, the vault, is reached from here too: see 04b_rogue_vault.yaml.
# The Mage will get a secret room here in a later version.

library_chaos:
  title: The Library
  text: |
    The humming door opens onto a library that goes up further than you can
    see. The books are rearranging themselves: sliding along shelves,
    swapping places, occasionally arguing.

    Three shelves seem to lean toward the three of you. Sable drifts toward
    one labelled *Treasures Best Left Unfound*. Fennick stops dead in front
    of *Spells You Should Never Have Started*. The one nearest you says
    *Research That Was Banned for Very Good Reasons*.

    "The inn," says Fennick, "is being *extremely* rude."
  role_text:
    scholar: |
      The humming door opens onto a library that goes up further than you can
      see, and for a moment you forget the storm, your friends and your own
      name. The books are rearranging themselves: sliding along shelves,
      swapping places, occasionally arguing about classification. You find
      yourself agreeing with the one on the left.

      Three shelves seem to lean toward the three of you. Sable drifts toward
      one labelled *Treasures Best Left Unfound*. Fennick stops dead in front
      of *Spells You Should Never Have Started*. The one nearest you says
      *Research That Was Banned for Very Good Reasons*.

      At the far end, behind a velvet rope, a door is marked **RESTRICTED**.

      "The inn," says Fennick, "is being *extremely* rude."
    rogue: |
      The humming door opens onto a library that goes up further than you can
      see. The books are rearranging themselves: sliding along shelves, swapping
      places, occasionally arguing. One of them shuffles aside to let you pass,
      which no book has ever done in your entire career.

      Three shelves seem to lean toward the three of you. Tamsin drifts toward
      *Research That Was Banned for Very Good Reasons*, stops, and pretends to
      be interested in something else. Fennick stops dead in front of *Spells
      You Should Never Have Started*. And the one nearest you is labelled
      *Treasures Best Left Unfound*, in gold letters that seem to wink.

      One of its books sticks out a little further than the rest, as if someone
      pushed it, and then pushed it back.

      "The inn," says Fennick, "is being *extremely* rude."
  choices:
    - id: open_vault_door
      label: Push the book that sticks out
      goto: rogue_vault
      requires:
        roles: [rogue]
        flags: [saw_vault_hint]
      show_locked: true   # greyed out until you've read the pencilled note in the guest book
      sets_flags: [visited_vault]
      starts_quests: [clear_the_air]
    - id: follow_shelf_mark
      label: Follow the shelf mark to the Restricted section
      goto: scholar_archive
      requires:
        roles: [scholar]
        flags: [saw_own_entry]
        not_flags: [visited_archive]
      show_locked: true   # greyed out until you've spotted the shelf mark in the guest book
      sets_flags: [visited_archive]
      starts_quests: [faulty_memory]
    - id: fennick_shelf
      label: Pull Fennick away from his shelf
      goto: library_chaos
      requires:
        not_flags: [pulled_fennick]
      sets_flags: [pulled_fennick]
      result_text: |
        "I wasn't reading it," Fennick says. "I was just... checking whether
        it's possible to un-kettle someone. Academically. For a friend."
    - id: back_to_hall
      label: Back to the main hall
      goto: main_hall

scholar_archive:
  title: Restricted Section, Shelf 12-B
  text: |
    The Restricted section is small, dusty and clearly never dusted, as
    requested. On shelf 12-B sits a single journal bound in blue leather.

    You know it before you open it. The cipher is yours. The handwriting is
    yours. The research is the thing you swore you'd burned: **memory ink**,
    the ink that makes people forget whatever it's written about.

    It worked beautifully, right up until the demonstration in Little
    Mumbling, when the whole town forgot Tuesdays. For a year. The Guild
    banned the research. You promised you'd destroyed every page.

    Apparently you came here twelve years ago, wrote it all down again,
    and then used a drop of the ink on yourself so you'd stop thinking about
    it. It's a very *you* solution. You hate it.

    The last page is dated this year, in handwriting you don't remember
    using: *"Little Mumbling still has no idea I was ever there. Nobody
    remembers the ink. Nobody remembers me. Is that a kindness?"*

    Beside the journal stands a tiny glass vial, stoppered with wax. The ink
    inside shimmers.

    Out in the library, Sable calls your name.
  choices:
    - id: take_journal
      label: Take the journal
      goto: scholar_archive
      requires:
        not_items: [forbidden_journal]
      gives: [forbidden_journal]
      starts_quests: [restore_research]
      result_text: The journal is warm, like it's been waiting. You tuck it under your coat. Nobody saw. Probably.
    - id: take_vial
      label: Pocket the vial of memory ink
      goto: scholar_archive
      requires:
        not_items: [memory_ink]
      gives: [memory_ink]
      starts_quests: [remember_me]
      result_text: |
        It's cold, and heavier than something that small should be. One drop
        and anything could be forgotten. You try very hard not to make a list.
    - id: back_to_library
      label: Back to the library
      goto: library_chaos
      requires:
        items: [forbidden_journal]
      result_text: You leave the archive quickly, and the Restricted door clicks shut behind you.
    - id: leave_everything
      label: Put everything back and walk away. Briskly.
      goto: library_chaos
      requires:
        not_items: [forbidden_journal]
      result_text: You walk away briskly. The shelf makes a small, disappointed noise.
