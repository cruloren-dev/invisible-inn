title: The Invisible Inn
description: >-
  Three old friends, one very rude storm, and an inn that only appears to
  people who need it.
start_scene: arrival_storm

min_players: 1
max_players: 1

roles:
  scholar:
    name: Scholar
    description: Knows a little about everything, a lot about footnotes, and nothing at all about what happened in Little Mumbling. Officially.
  rogue:
    name: Rogue
    description: Can open any lock, except the one on her own past.
  mage:
    name: Mage
    description: Half-finished spells and wholly unfinished business.
    playable: false
